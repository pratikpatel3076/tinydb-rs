name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / build / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      # Compiling the tests is a hard gate: the API must stay usable even while
      # the bodies are todo!().
      - name: Compile tests
        run: cargo test --all-targets --no-run

      # The scaffold's tests fail on purpose (todo! panics). Flip
      # `continue-on-error` off as soon as Phase 1 is green.
      - name: Test (expected to fail until phases land)
        continue-on-error: true
        run: cargo test --all-targets
